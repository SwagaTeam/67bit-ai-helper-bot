services:
  promassist-mcp:
    build: .
    container_name: promassist-mcp
    volumes:
      - ./generated_docs:/app/generated_docs
    restart: unless-stopped
    stdin_open: true
    tty: true

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME:-host.docker.internal}
      - KC_HOSTNAME_PORT=${KEYCLOAK_PORT:-8081}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8081:8080" # <--- ИСПРАВЛЕНО
    depends_on:
      - keycloak-db
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        limits:
          memory: 16G
    container_name: ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0:11434}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-true}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-open-webui}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-2ka9x4oDhZtl7Nv5k2SkdaPy9a6Bh0vE}
      # Заменили localhost на host.docker.internal
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-http://host.docker.internal:8081/realms/openwebui/.well-known/openid-configuration}
      - ENABLE_OAUTH=${ENABLE_OAUTH:-true}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      - ENABLE_LOGIN_FORM=false
    # Добавляем host-gateway, чтобы host.docker.internal гарантированно работал в Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
      - keycloak # Добавили зависимость от Keycloak
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  ollama-data:
  open-webui-data:
  keycloak-data:
  keycloak-db-data:
