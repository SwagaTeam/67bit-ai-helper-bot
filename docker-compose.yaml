services:
  promassist-mcp:
    build: ./promassist-mcp
    container_name: promassist-mcp
    networks:
      - prom-network
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_TOKEN=${JIRA_TOKEN}
    ports:
      - "8000:8000"
    command: python main.py 
    volumes:
      - ./generated_docs:/app/generated_docs
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME=http://localhost:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_PORT=8081
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=false
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8081:8081"
    depends_on:
      - keycloak-db
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 16G
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - prom-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-true}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-open-webui}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-X0h7wAoavejNVs9IdmUtzCFMDijY254B}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-http://keycloak:8081/realms/openwebui/.well-known/openid-configuration}
      - ENABLE_OAUTH=${ENABLE_OAUTH:-true}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      - ENABLE_LOGIN_FORM=true
      - OPENID_REDIRECT_URI=http://localhost:8080/oauth/oidc/callback
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
      - keycloak
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  ollama-data:
  open-webui-data:
  keycloak-data:
  keycloak-db-data:

networks:
  prom-network:
    driver: bridge