<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 40px; }
        .header { text-align: center; border-bottom: 2px solid #004d99; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #999; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; width: 30%; }
        .footer { margin-top: 30px; font-size: 0.8em; text-align: center; color: #777; }
    </style>
</head>
<body>
    <div class="header"><h1>ПАСПОРТ ПРОЕКТА</h1></div>
    <table>
        <tr><th>Название</th><td>{{ full_name }}</td></tr>
        <tr><th>Предприятие</th><td>{{ enterprise }}</td></tr>
        <tr><th>Руководитель</th><td>{{ project_manager }}</td></tr>
        <tr><th>Цель (SMART)</th><td>{{ goal }}</td></tr>
        <tr><th>Бюджет</th><td>{{ budget }} руб.</td></tr>
        <tr><th>Эффект</th><td>{{ economic_effect }}</td></tr>
    </table>
    <div class="footer">Документ сформирован ИИ-ассистентом "PromAssist"</div>
</body>
</html>
